name: Cyclops analysis

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: cyclops-analysis-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze mutations (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the pull request head
        id: checkout
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        id: setup-go
        if: steps.checkout.outcome == 'success'
        continue-on-error: true
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.23'
          cache: false

      - name: Select the incremental comparison base
        id: base
        if: steps.checkout.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TARGET_REF: ${{ github.event.pull_request.base.ref }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          target="refs/remotes/origin/${TARGET_REF}"
          git fetch --no-tags origin "+refs/heads/${TARGET_REF}:${target}"

          marker='<!-- cyclops-report:v1 -->'
          stored="$({
            gh api --paginate "repos/${REPOSITORY}/issues/${PR_NUMBER}/comments" \
              --jq ".[] | select(.body | contains(\"${marker}\")) | .body"
          } | sed -n 's/^<!-- cyclops-state: \([0-9a-f]\{40\}\) -->$/\1/p' | tail -n 1)"

          mode=initial
          diff_base="$target"
          previous_head=""
          if [[ "$stored" =~ ^[0-9a-f]{40}$ ]] && git merge-base --is-ancestor "$stored" HEAD; then
            mode=incremental
            diff_base="$stored"
            previous_head="$stored"
          elif [[ -n "$stored" ]]; then
            mode=fallback
          fi

          {
            printf 'diff_base=%s\n' "$diff_base"
            printf 'mode=%s\n' "$mode"
            printf 'previous_head=%s\n' "$previous_head"
          } >> "$GITHUB_OUTPUT"

      - name: Install Cyclops and mutation engine
        id: install
        if: steps.setup-go.outcome == 'success' && steps.base.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          go install ./cmd/cyclops
          if [[ -f Cargo.toml ]]; then
            cargo install --locked cargo-mutants
          elif [[ -f go.mod ]]; then
            GOTOOLCHAIN=auto go install github.com/go-gremlins/gremlins/cmd/gremlins@v0.6.0
          else
            printf 'Cyclops requires Cargo.toml or go.mod at the repository root.\n' >&2
            exit 1
          fi

      - name: Run Cyclops without blocking the pull request
        id: cyclops
        if: steps.install.outcome == 'success'
        continue-on-error: true
        env:
          CYCLOPS_DIFF_BASE: ${{ steps.base.outputs.diff_base }}
        shell: bash
        run: |
          set -u
          mapfile -t production_changes < <(
            git diff --name-only --diff-filter=ACMRTUXB "$CYCLOPS_DIFF_BASE" -- '*.go' '*.rs' \
              | awk '/\.go$/ && !/_test\.go$/ { print; next } /(^|\/)src\/.*\.rs$/ { print }'
          )
          mapfile -t test_changes < <(
            git diff --name-only "$CYCLOPS_DIFF_BASE" -- '*.go' '*.rs' \
              | awk '/_test\.go$/ { print; next } /\.rs$/ && !/(^|\/)src\// { print }'
          )

          if (( ${#production_changes[@]} > 0 )); then
            set +e
            cyclops --diff "$CYCLOPS_DIFF_BASE" > cyclops.log 2>&1
            code=$?
            set -e
            printf 'scope=production diff\n' >> "$GITHUB_OUTPUT"
            printf '%s\n' "${production_changes[@]}" > scope.txt
          elif (( ${#test_changes[@]} > 0 )); then
            if ! cyclops --list-test-targets "$CYCLOPS_DIFF_BASE" > test-targets.txt 2> cyclops.log; then
              {
                printf 'result=error\n'
                printf 'exit_code=1\n'
                printf 'scope=test changes (mapping failed)\n'
              } >> "$GITHUB_OUTPUT"
              printf '%s\n' "${test_changes[@]}" > scope.txt
              exit 0
            fi
            mapfile -t test_targets < test-targets.txt
            if (( ${#test_targets[@]} == 0 )); then
              printf 'Changed tests did not resolve to any production files; Cyclops was not invoked.\n' > cyclops.log
              {
                printf 'result=no-candidates\n'
                printf 'exit_code=0\n'
                printf 'scope=test changes (no production mapping)\n'
              } >> "$GITHUB_OUTPUT"
              printf '%s\n' "${test_changes[@]}" > scope.txt
              exit 0
            fi
            set +e
            cyclops "${test_targets[@]}" > cyclops.log 2>&1
            code=$?
            set -e
            printf 'scope=test-affected packages\n' >> "$GITHUB_OUTPUT"
            printf '%s\n' "${test_targets[@]}" > scope.txt
          else
            printf 'No changed production files; Cyclops was not invoked.\n' > cyclops.log
            {
              printf 'result=no-candidates\n'
              printf 'exit_code=0\n'
              printf 'scope=no relevant changes\n'
            } >> "$GITHUB_OUTPUT"
            : > scope.txt
            exit 0
          fi

          {
            printf 'exit_code=%s\n' "$code"
            if (( code == 0 )); then
              printf 'result=complete\n'
            else
              printf 'result=error\n'
            fi
          } >> "$GITHUB_OUTPUT"
          exit 0

      - name: Build the pull-request report
        if: always()
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MODE: ${{ steps.base.outputs.mode }}
          DIFF_BASE: ${{ steps.base.outputs.diff_base }}
          PREVIOUS_HEAD: ${{ steps.base.outputs.previous_head }}
          CYCLOPS_RESULT: ${{ steps.cyclops.outputs.result }}
          CYCLOPS_EXIT: ${{ steps.cyclops.outputs.exit_code }}
          CYCLOPS_SCOPE: ${{ steps.cyclops.outputs.scope }}
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          SETUP_OUTCOME: ${{ steps.setup-go.outcome }}
          BASE_OUTCOME: ${{ steps.base.outcome }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
        shell: bash
        run: |
          result="$CYCLOPS_RESULT"
          exit_code="${CYCLOPS_EXIT:-1}"
          if [[ -z "$result" ]]; then
            result=error
            printf 'Cyclops preparation failed (checkout=%s, setup=%s, base=%s, install=%s).\n' \
              "$CHECKOUT_OUTCOME" "$SETUP_OUTCOME" "$BASE_OUTCOME" "$INSTALL_OUTCOME" > cyclops.log
            : > scope.txt
          fi
          jq -n \
            --argjson pr "$PR_NUMBER" \
            --argjson run_id "$RUN_ID" \
            --arg head "$HEAD_SHA" \
            --arg mode "${MODE:-initial}" \
            --arg diff_base "${DIFF_BASE:-unknown}" \
            --arg previous_head "$PREVIOUS_HEAD" \
            --arg result "$result" \
            --arg scope_kind "${CYCLOPS_SCOPE:-unavailable}" \
            --rawfile scope_targets scope.txt \
            --argjson exit_code "$exit_code" \
            --arg run_url "$RUN_URL" \
            '{version: 1, pr: $pr, run_id: $run_id, head: $head, mode: $mode,
              diff_base: $diff_base, previous_head: $previous_head, result: $result,
              scope_kind: $scope_kind, scope_targets: ($scope_targets | split("\n") | map(select(length > 0))),
              exit_code: $exit_code, run_url: $run_url}' > report.json

      - name: Create or update the persistent pull-request comment
        if: always()
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- cyclops-report:v1 -->';
            const report = JSON.parse(fs.readFileSync('report.json', 'utf8'));
            const pullRequest = context.payload.pull_request;

            if (report.version !== 1 || report.pr !== pullRequest.number || report.head !== pullRequest.head.sha) {
              core.setFailed('Cyclops report does not match this pull request');
              return;
            }

            const {owner, repo} = context.repo;
            const {data: current} = await github.rest.pulls.get({owner, repo, pull_number: report.pr});
            if (current.state !== 'open' || current.head.sha !== report.head) {
              core.notice('Skipping a stale Cyclops report because the pull-request head changed');
              return;
            }

            const allowedModes = new Set(['initial', 'incremental', 'fallback']);
            const allowedResults = new Set(['complete', 'no-candidates', 'error']);
            if (!allowedModes.has(report.mode) || !allowedResults.has(report.result)) {
              core.setFailed('Cyclops report mode or result is invalid');
              return;
            }

            let log = fs.readFileSync('cyclops.log', 'utf8');
            log = log.slice(-30000).replaceAll('```', '` ` `').replaceAll('<!--', '< !--');
            const short = value => /^[0-9a-f]{40}$/.test(value) ? value.slice(0, 12) : value;
            const successful = report.result === 'complete' || report.result === 'no-candidates';
            const state = successful ? report.head : report.previous_head;
            const stateMarker = /^[0-9a-f]{40}$/.test(state)
              ? `<!-- cyclops-state: ${state} -->`
              : '<!-- cyclops-state: none -->';
            const resultLabel = {
              complete: 'Completed',
              'no-candidates': 'No mutation candidates',
              error: `Execution/reporting error (exit ${report.exit_code})`,
            }[report.result];
            const escape = value => String(value)
              .replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;')
              .replaceAll('`', '&#96;');
            const scope = Array.isArray(report.scope_targets) && report.scope_targets.length > 0
              ? report.scope_targets.map(target => `\`${escape(target)}\``).join('<br>')
              : 'None';

            const body = `${marker}
            ${stateMarker}
            ## Cyclops mutation report

            > Informational only. Mutation findings and reporting failures do not block merging.

            | Field | Value |
            | --- | --- |
            | Result | ${resultLabel} |
            | Mode | ${report.mode} |
            | Mutation scope | ${report.scope_kind} |
            | Production targets | ${scope} |
            | Comparison base | \`${short(report.diff_base)}\` |
            | Analyzed head | \`${short(report.head)}\` |
            | Full logs | [GitHub Actions run](${report.run_url}) |

            <details>
            <summary>Cyclops output</summary>

            \`\`\`text
            ${log}
            \`\`\`
            </details>`;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: report.pr, per_page: 100,
            });
            const existing = comments.find(comment => comment.user?.type === 'Bot' && comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({owner, repo, comment_id: existing.id, body});
            } else {
              await github.rest.issues.createComment({owner, repo, issue_number: report.pr, body});
            }
