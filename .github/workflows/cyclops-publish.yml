name: Cyclops report

on:
  workflow_run:
    workflows: [Cyclops analysis]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  publish:
    name: Publish mutation report (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download the analysis artifact
        id: download
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cyclops-report
          path: cyclops-report
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Create or update the persistent pull-request comment
        if: steps.download.outcome == 'success'
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- cyclops-report:v1 -->';
            const report = JSON.parse(fs.readFileSync('cyclops-report/report.json', 'utf8'));
            const workflowRun = context.payload.workflow_run;

            if (report.version !== 1 || report.run_id !== workflowRun.id) {
              core.setFailed('Cyclops artifact version or workflow run ID is invalid');
              return;
            }
            if (!Number.isInteger(report.pr) || !/^[0-9a-f]{40}$/.test(report.head)) {
              core.setFailed('Cyclops artifact pull request or head SHA is invalid');
              return;
            }
            if (!workflowRun.pull_requests.some(pr => pr.number === report.pr)) {
              core.setFailed('Cyclops artifact does not belong to this workflow run');
              return;
            }

            const {owner, repo} = context.repo;
            const {data: pull} = await github.rest.pulls.get({owner, repo, pull_number: report.pr});
            if (pull.state !== 'open' || pull.head.sha !== report.head) {
              core.notice('Skipping a stale Cyclops report because the pull-request head changed');
              return;
            }

            const allowedModes = new Set(['initial', 'incremental', 'fallback']);
            const allowedResults = new Set(['complete', 'no-candidates', 'error']);
            if (!allowedModes.has(report.mode) || !allowedResults.has(report.result)) {
              core.setFailed('Cyclops artifact mode or result is invalid');
              return;
            }

            let log = fs.readFileSync('cyclops-report/cyclops.log', 'utf8');
            log = log.slice(-30000).replaceAll('```', '` ` `').replaceAll('<!--', '< !--');
            const short = value => /^[0-9a-f]{40}$/.test(value) ? value.slice(0, 12) : value;
            const successful = report.result === 'complete' || report.result === 'no-candidates';
            const state = successful ? report.head : report.previous_head;
            const stateMarker = /^[0-9a-f]{40}$/.test(state)
              ? `<!-- cyclops-state: ${state} -->`
              : '<!-- cyclops-state: none -->';
            const resultLabel = {
              complete: 'Completed',
              'no-candidates': 'No mutation candidates',
              error: `Execution/reporting error (exit ${report.exit_code})`,
            }[report.result];

            const body = `${marker}
            ${stateMarker}
            ## Cyclops mutation report

            > Informational only. Mutation findings and reporting failures do not block merging.

            | Field | Value |
            | --- | --- |
            | Result | ${resultLabel} |
            | Mode | ${report.mode} |
            | Comparison base | \`${short(report.diff_base)}\` |
            | Analyzed head | \`${short(report.head)}\` |
            | Full logs | [GitHub Actions run](${report.run_url}) |

            <details>
            <summary>Cyclops output</summary>

            \`\`\`text
            ${log}
            \`\`\`
            </details>`;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: report.pr, per_page: 100,
            });
            const existing = comments.find(comment => comment.user?.type === 'Bot' && comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({owner, repo, comment_id: existing.id, body});
            } else {
              await github.rest.issues.createComment({owner, repo, issue_number: report.pr, body});
            }

      - name: Keep the publisher non-blocking
        if: always()
        run: echo 'Cyclops reporting is informational; inspect earlier step logs for any warning.'
